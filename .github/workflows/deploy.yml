name: Deploy web app

# Publishes both apps to GitHub Pages, once Pages is turned on (Settings > Pages > Source:
# GitHub Actions; until then the deploy is skipped, not failed):
#   /RepCurve/       RepCurve, built from main
#   /RepCurve/test/  RepCurve Test, built from the test branch (or from main until that exists)
# A push to either branch republishes both, so neither ever disappears.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deploy half way; a newer push waits its turn.
  cancel-in-progress: false

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't turned on for this repository, so the web app wasn't deployed. See apps/web/README.md for hosting options."
          fi

  build:
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      # The real app always comes from main, whichever branch was pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds RepCurve into apps/web/dist and, from the same code, RepCurve Test into dist/test.
      - run: pnpm build:web
      # Then, when the test branch exists, RepCurve Test is rebuilt from it instead.
      - id: test-branch
        run: |
          if git ls-remote --exit-code --heads origin test >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test branch yet, so RepCurve Test is built from main."
          fi
      - if: steps.test-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: test
          path: test-branch
      - if: steps.test-branch.outputs.exists == 'true'
        working-directory: test-branch
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @repcurve/web build:test
          rm -rf ../apps/web/dist/test
          cp -r apps/web/dist/test ../apps/web/dist/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
